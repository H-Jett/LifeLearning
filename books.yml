# 这个仓库有哪些书 —— 单一真源。
#
# 加一本书 = 建 books/<slug>/ 目录 + 在下面加一条记录。
# 构建脚本据此决定「构建哪些书」和「索引页列哪些书」，
# 不会出现「书加了但索引忘了改」。

# 站点根地址。**仓库改名时只改这一行**，各书的 site_url 由它拼出。
base_url: https://h-jett.github.io/LifeLearning/
repo_url: https://github.com/H-Jett/LifeLearning

# PWA（手机「添加到主屏幕」后的表现）
app_name: 走走停停
app_short_name: 走走停停
app_theme_color: "#2C2C2A"        # 书架首页的地址栏配色（各书用自己的，见下）
app_background_color: "#FBFBFA"

site_title: 走走停停
site_tagline: 一个方向一个仓库 · 这里放「走走停停」的书
site_description: >-
  每本书自成体系、独立成站：概念 → 思考题 → 实操，力求正确，
  结论尽量给出处，流传的说法逐条标注证据强度。

books:
  - slug: tea
    dir: books/tea
    title: 系统学茶
    subtitle: 从一片叶子到一杯茶汤
    description: 工艺原理 + 茶叶化学 + 感官审评，深度对标评茶员知识体系。
    status: 进行中
    progress: 七部分 40 章 · 已完成第一部分 + 第 5、6 章
    palette:                       # 这本书的专属配色（不与其他书重复，见构建脚本的查重）
      primary: "#3F6B2B"           # 页头 / 主色
      accent: "#6E9B3E"            # 链接 hover / 强调
    checks:
      - python scripts/figures/make_figures.py --check
      - python scripts/check_book.py --quiet

  - slug: jewelry
    dir: books/jewelry
    title: 珠宝入门
    subtitle: 从宝石学原理到选购决策
    description: 选购避坑 + 系统宝石学，对标准 GIA / FGA 的知识框架。
    status: 进行中
    progress: 已完成第一部分 · 宝石学地基（11 章 + 项目 P1）
    palette:
      primary: "#4F4287"
      accent: "#7A6BB5"
    checks:
      - python scripts/check_book.py

  - slug: coffee
    dir: books/coffee
    title: 系统学咖啡
    subtitle: 从一颗生豆到一杯咖啡
    description: 风味化学 + 处理法与烘焙 + 萃取原理 + 杯测感官，对标 SCA / Q-Grader 知识框架。
    status: 进行中
    progress: 骨架与路线图就绪 · 第 1 章已完成
    palette:
      primary: "#A35E2A"           # 烘焙琥珀
      accent: "#C8873F"
    checks:
      - python scripts/check_book.py

  - slug: wine
    dir: books/wine
    title: 系统品酒
    subtitle: 从葡萄酒到烈酒
    description: 品种与产区 + 酿造与陈年 + 系统品鉴，对标 WSET 的品酒与产区框架。
    status: 进行中
    progress: 骨架与路线图就绪 · 第 1 章已完成
    palette:
      primary: "#8E1B36"           # 勃艮第红
      accent: "#B8455F"
    checks:
      - python scripts/check_book.py

  - slug: chanlun
    dir: books/chanlun
    title: 系统学缠论
    subtitle: 从走势分类到可检验的判据
    description: 讲透定义链条（分型→笔→线段→中枢→背驰→买卖点），并给每条主张标清楚是定义、推论、经验断言还是不可证伪。不荐股、不预测、不构成投资建议。
    status: 进行中
    progress: 骨架与路线图就绪 · 第 1 章已完成
    palette:
      primary: "#2563EB"           # 分析蓝。刻意避开红绿——A股与欧美涨跌配色相反，
      accent: "#5B8DEF"            # 主色带红绿会给整站页面带上方向暗示；青色已被 cooking 占用
    checks:
      - python scripts/check_book.py

  - slug: cooking
    dir: books/cooking
    title: 做菜的原理
    subtitle: 从照着菜谱做到自己决定怎么做
    description: 给厨房小白的原理书：热、水、味、时间四条线，讲清每一步操作、每一味调料、每个先后顺序的道理。
    status: 进行中
    progress: 骨架与路线图就绪 · 第 1 章已完成
    palette:
      primary: "#0F6E7E"           # 灶台青
      accent: "#1F8C9B"
    checks:
      - python scripts/check_book.py

  - slug: baking
    dir: books/baking
    title: 烘焙的原理
    subtitle: 从看懂配方到自己改配方
    description: 面粉、水、糖、油、蛋、盐与膨发剂各自在做什么——讲清每一步操作和每个比例的道理，学会举一反三地改配方。
    status: 进行中
    progress: 骨架与路线图就绪 · 第 1 章已完成
    palette:
      primary: "#A63A82"           # 莓果紫红。棕/焦糖色系已被 coffee 占满（距离不足），刻意换色域
      accent: "#C4629E"
    checks:
      - python scripts/check_book.py
