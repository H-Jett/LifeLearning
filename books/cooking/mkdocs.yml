site_name: 做菜的原理：从照着菜谱做到自己决定怎么做
site_description: 一本边学边记、力求正确的做菜原理书——热、水、味、时间四条线
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/cooking/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书的内容全部在 docs/（MkDocs 默认文档目录）。GitHub 上照样能直接浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 底层四条线:
      - chapters/01-four-lines/00-intro.md
      - 第 1 章 · 一道菜里到底在发生什么: chapters/01-four-lines/01-what-happens-in-a-dish.md
      - 第 2 章 · 传热：导热、对流、辐射: chapters/01-four-lines/02-heat-transfer.md
      - 第 3 章 · 水：食材里的水、锅里的水、跑掉的水: chapters/01-four-lines/03-water.md
      - 第 4 章 · 蛋白质：变性、凝固与保水: chapters/01-four-lines/04-protein.md
      - 第 5 章 · 胶原与结缔组织: chapters/01-four-lines/05-collagen.md
      - 第 6 章 · 淀粉：糊化与回生: chapters/01-four-lines/06-starch.md
      - 第 7 章 · 褐变：美拉德反应与焦糖化: chapters/01-four-lines/07-browning.md
      - 第 8 章 · 酸与碱: chapters/01-four-lines/08-acid-alkali.md
      - 🛠 项目 P1 · 把菜谱翻译成原理: chapters/01-four-lines/project-p1-recipe-translation.md
  - 第二部分 · 味觉与调味原理:
      - chapters/02-taste/00-intro.md
      - 第 9 章 · 味觉是怎么工作的: chapters/02-taste/09-taste.md
      - 第 10 章 · 味与味之间: chapters/02-taste/10-taste-interaction.md
      - 第 11 章 · 盐：唯一不可替代的调料: chapters/02-taste/11-salt.md
      - 第 12 章 · 糖与酸: chapters/02-taste/12-sugar-acid.md
      - 第 13 章 · 鲜与香: chapters/02-taste/13-umami-aroma.md
  - 记录表:
      - forms/index.md
      - 一道菜的处理方案表: forms/dish-plan.md
      - 尝味纠偏表: forms/tasting-fix.md
  - 术语表: glossary.md
  - 参考书目与出处登记: standards.md
  - 思考题参考答案:
      - 第 1 章: qa/01-what-happens-in-a-dish-qa.md
      - 第 2 章: qa/02-heat-transfer-qa.md
      - 第 3 章: qa/03-water-qa.md
      - 第 4 章: qa/04-protein-qa.md
      - 第 5 章: qa/05-collagen-qa.md
      - 第 6 章: qa/06-starch-qa.md
      - 第 7 章: qa/07-browning-qa.md
      - 第 8 章: qa/08-acid-alkali-qa.md
      - 第 9 章: qa/09-taste-qa.md
      - 第 10 章: qa/10-taste-interaction-qa.md
      - 第 11 章: qa/11-salt-qa.md
      - 第 12 章: qa/12-sugar-acid-qa.md
      - 第 13 章: qa/13-umami-aroma-qa.md

extra:
  # 点页头站名/logo 回书架。用 !ENV 由 build_site.py 注入，
  # 这样改仓库名仍然只需要动 books.yml 一行。
  homepage: !ENV [SHELF_URL, "/"]

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
