site_name: 系统学咖啡：从一颗生豆到一杯咖啡
site_description: 一本边学边记、力求正确的咖啡书——风味化学 + 处理与烘焙 + 萃取原理 + 杯测感官
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/coffee/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书的内容全部在 docs/（MkDocs 默认文档目录）。GitHub 上照样能直接浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 咖啡的物质基础:
      - chapters/01-foundation/00-intro.md
      - 第 1 章 · 一颗咖啡豆里有什么: chapters/01-foundation/01-bean-composition.md
      - 第 2 章 · 咖啡果与咖啡豆的结构: chapters/01-foundation/02-cherry-anatomy.md
      - 第 3 章 · 水：被忽略的 98%: chapters/01-foundation/03-water.md
      - 第 4 章 · 风味是怎么被感知的: chapters/01-foundation/04-perception.md
      - 第 5 章 · 咖啡与健康：只讲证据等级: chapters/01-foundation/05-health-evidence.md
      - 🛠 项目 P1 · 给三包豆做一份"成分翻译": chapters/01-foundation/project-P1-composition-translation.md
  - 第二部分 · 上游：从一棵树到一袋生豆:
      - chapters/02-upstream/00-intro.md
      - 第 6 章 · 物种与品种: chapters/02-upstream/06-species-varieties.md
      - 第 7 章 · 种植环境: chapters/02-upstream/07-growing-environment.md
      - 第 8 章 · 病虫害与品种更新: chapters/02-upstream/08-pests-and-renewal.md
      - 第 9 章 · 采收与成熟度: chapters/02-upstream/09-harvest-ripeness.md
      - 第 10 章 · 处理法 ①：日晒、水洗、蜜处理: chapters/02-upstream/10-processing-basics.md
      - 第 11 章 · 处理法 ②：厌氧与接种发酵: chapters/02-upstream/11-fermentation-experimental.md
      - 第 12 章 · 干燥、含水率与生豆储存: chapters/02-upstream/12-drying-storage.md
      - 第 13 章 · 生豆分级与瑕疵: chapters/02-upstream/13-green-grading.md
      - 第 14 章 · 产区地图：把地名拆回自变量: chapters/02-upstream/14-origin-map.md
      - 🛠 项目 P2 · 同产区、不同处理法的对照: chapters/02-upstream/project-P2-processing-comparison.md
  - 第三部分 · 烘焙：把前体变成风味:
      - chapters/03-roasting/00-intro.md
      - 第 15 章 · 烘焙的物理: chapters/03-roasting/15-roasting-physics.md
      - 第 16 章 · 烘焙的化学 ①：脱水、焦糖化与美拉德: chapters/03-roasting/16-roasting-chemistry-1.md
      - 第 17 章 · 烘焙的化学 ②：绿原酸与苦味: chapters/03-roasting/17-cga-and-bitterness.md
  - 记录表:
