site_name: 系统学茶
site_description: 一本边学边记、力求正确的茶学入门书 —— 工艺原理 + 茶叶化学 + 感官审评
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/tea/docs/
theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书内容放在 docs/（MkDocs 默认文档目录）。GitHub 上照样能浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。

# 只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown 扩展。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 术语表: glossary.md
  - 国标与文献索引: standards.md
  - 第一部分 · 茶的物质基础:
      - chapters/01-foundation/00-intro.md
      - 第 1 章 · 一片叶子里有什么: chapters/01-foundation/01-leaf-chemistry.md
      - 第 2 章 · 品种、产地与"山场": chapters/01-foundation/02-cultivar-terroir.md
      - 第 3 章 · 鲜叶与采摘: chapters/01-foundation/03-plucking.md
      - 第 4 章 · 酶与氧化: chapters/01-foundation/04-enzymes-oxidation.md
      - 第一部分小结（速查）: chapters/01-foundation/summary.md
  - 第二部分 · 六大茶类与工艺原理:
      - chapters/02-processing/00-intro.md
      - 第 5 章 · 分类的逻辑: chapters/02-processing/05-classification.md
      - 第 6 章 · 绿茶：杀青: chapters/02-processing/06-green-tea.md
  - 记录表:
      - 冲泡记录表: forms/brewing-log.md
  - 思考题参考答案:
      - 第 1 章 · 成分与滋味: qa/01-leaf-chemistry-qa.md
      - 第 2 章 · 品种与产地: qa/02-cultivar-terroir-qa.md
      - 第 3 章 · 鲜叶与采摘: qa/03-plucking-qa.md
      - 第 4 章 · 酶与氧化: qa/04-enzymes-oxidation-qa.md
      - 第 5 章 · 分类的逻辑: qa/05-classification-qa.md
      - 第 6 章 · 绿茶：杀青: qa/06-green-tea-qa.md

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
