<text x="24" y="406" font-family="Noto Sans CJK SC,Source Han Sans SC,PingFang SC,Microsoft YaHei,Hiragino Sans GB,WenQuanYi Micro Hei,sans-serif" font-size="12.5" fill="#666666" text-anchor="start" font-weight="normal" font-style="normal">乌龙茶最长（5 步），而且是唯一把「杀青」放在氧化工序（做青）之后的——先让它走，再叫停。</text>
<text x="24" y="426" font-family="Noto Sans CJK SC,Source Han Sans SC,PingFang SC,Microsoft YaHei,Hiragino Sans GB,WenQuanYi Micro Hei,sans-serif" font-size="12.5" fill="#666666" text-anchor="start" font-weight="normal" font-style="normal">黄茶 = 绿茶 + 闷黄；黑茶 = 绿茶 + 渥堆。这两类都是「在绿茶之后再加一步」。</text>
