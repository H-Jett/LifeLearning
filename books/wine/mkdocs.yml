site_name: 系统品酒：从葡萄酒到烈酒
site_description: 一本边学边记、力求正确的品酒书——从分子到酒标，从葡萄酒到烈酒
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/wine/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书的内容全部在 docs/（MkDocs 默认文档目录）。GitHub 上照样能直接浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

# ⚠️ nav 只列**真实存在**的文件，否则 mkdocs build --strict 会失败。
# 新增章节时同时加「章节 nav」和「思考题参考答案 nav」两处。
nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 一杯酒的物质基础与感官:
      - chapters/01-foundation/00-intro.md
      - 第 1 章 · 一杯酒里有什么: chapters/01-foundation/01-what-is-in-the-glass.md
      - 第 2 章 · 感官通道: chapters/01-foundation/02-sensory-channels.md
      - 第 3 章 · 酒精发酵: chapters/01-foundation/03-alcoholic-fermentation.md
      - 第 4 章 · 香气的三个来源: chapters/01-foundation/04-three-origins-of-aroma.md
      - 第 5 章 · 配角与麻烦：SO₂ · CO₂ · 矿物感: chapters/01-foundation/05-so2-co2-minerality.md
      - 🛠 项目 P1 · 把一杯酒拆成六个结构要素: chapters/01-foundation/project-P1-six-structural-elements.md
  - 第二部分 · 葡萄品种与风土:
      - chapters/02-grape-terroir/00-intro.md
      - 第 6 章 · 葡萄这种植物：物种、砧木与根瘤蚜: chapters/02-grape-terroir/06-grapevine-rootstock-phylloxera.md
      - 第 7 章 · 从萌芽到采收：物候期与糖酸: chapters/02-grape-terroir/07-phenology-and-ripening.md
      - 第 8 章 · 风土：哪些可证，哪些是叙事: chapters/02-grape-terroir/08-terroir.md
      - 第 9 章 · 白葡萄品种谱系: chapters/02-grape-terroir/09-white-varieties.md
      - 第 10 章 · 红葡萄品种谱系: chapters/02-grape-terroir/10-red-varieties.md
      - 第 11 章 · 葡萄园管理：产量 · 架式 · 有机: chapters/02-grape-terroir/11-vineyard-management.md
  - 第三部分 · 酿造与陈年工艺:
      - chapters/03-winemaking/00-intro.md
      - 第 12 章 · 红葡萄酒：破碎、浸皮与萃取曲线: chapters/03-winemaking/12-red-winemaking-extraction.md
      - 第 13 章 · 白葡萄酒与桃红: chapters/03-winemaking/13-white-and-rose.md
      - 第 14 章 · 苹果酸乳酸发酵与酒泥接触: chapters/03-winemaking/14-mlf-and-lees.md
      - 第 15 章 · 橡木：桶的化学与替代品: chapters/03-winemaking/15-oak.md
      - 第 16 章 · 起泡酒：传统法、罐式法与气压: chapters/03-winemaking/16-sparkling.md
      - 第 17 章 · 加强酒与甜酒: chapters/03-winemaking/17-fortified-and-sweet.md
  - 速查与资料:
      - 出处与资料登记: standards.md
      - 术语表: glossary.md
  - 记录表:
      - forms/index.md
      - 品鉴记录表: forms/tasting-note.md
  - 思考题参考答案:
      - 第 1 章: qa/01-what-is-in-the-glass-qa.md
      - 第 2 章: qa/02-sensory-channels-qa.md
      - 第 3 章: qa/03-alcoholic-fermentation-qa.md
      - 第 4 章: qa/04-three-origins-of-aroma-qa.md
      - 第 5 章: qa/05-so2-co2-minerality-qa.md
      - 第 6 章: qa/06-grapevine-rootstock-phylloxera-qa.md
      - 第 7 章: qa/07-phenology-and-ripening-qa.md
      - 第 8 章: qa/08-terroir-qa.md
      - 第 9 章: qa/09-white-varieties-qa.md
      - 第 10 章: qa/10-red-varieties-qa.md
      - 第 11 章: qa/11-vineyard-management-qa.md
      - 第 12 章: qa/12-red-winemaking-extraction-qa.md
      - 第 13 章: qa/13-white-and-rose-qa.md
      - 第 14 章: qa/14-mlf-and-lees-qa.md
      - 第 15 章: qa/15-oak-qa.md
      - 第 16 章: qa/16-sparkling-qa.md
      - 第 17 章: qa/17-fortified-and-sweet-qa.md

extra:
  # 点页头站名/logo 回书架。用 !ENV 由 build_site.py 注入，
  # 这样改仓库名仍然只需要动 books.yml 一行。
  homepage: !ENV [SHELF_URL, "/"]

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
