site_name: 烘焙的原理：从看懂配方到自己改配方
site_description: 一本边学边记、力求正确的烘焙原理书——面粉、水、糖、油、蛋、盐与膨松剂各自在做什么
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/baking/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面，补充内容缩进其下
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 书的内容全部在 docs/（MkDocs 默认文档目录）。GitHub 上照样能直接浏览 docs/ 里的 .md，
# 二者共用同一批文件，零内容重复。只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 原料各自在做什么:
      - chapters/01-ingredients/00-intro.md
      - 第 1 章 · 一份配方里的每样东西在做什么: chapters/01-ingredients/01-what-each-ingredient-does.md
      - 第 2 章 · 面粉：蛋白质、面筋、淀粉、灰分与损伤淀粉: chapters/01-ingredients/02-flour.md
      - 第 3 章 · 水：水合、含水量与水粉比: chapters/01-ingredients/03-water.md
      - 第 4 章 · 糖：甜以外的四件事: chapters/01-ingredients/04-sugar.md
      - 第 5 章 · 油脂：阻断面筋、充气与口感: chapters/01-ingredients/05-fat.md
      - 第 6 章 · 蛋：水分、乳化剂、结构和气泡: chapters/01-ingredients/06-egg.md
      - 第 7 章 · 盐：风味、控速与对面筋的作用: chapters/01-ingredients/07-salt.md
      - 第 8 章 · 膨松剂总览：酵母、小苏打、泡打粉: chapters/01-ingredients/08-leavening-agents.md
      - 第 9 章 · 烘焙百分比：换算、缩放与比较: chapters/01-ingredients/09-bakers-percentage.md
      - 🛠 项目 P1 · 把一份配方解码: chapters/01-ingredients/project-P1-decode-a-recipe.md
  - 第二部分 · 膨发的三条路线:
      - chapters/02-leavening/00-intro.md
      - 第 10 章 · 气从哪来、被什么关住：膨发的通用模型: chapters/02-leavening/10-leavening-model.md
      - 第 11 章 · 生物膨发一：酵母怎么工作: chapters/02-leavening/11-yeast.md
      - 第 12 章 · 生物膨发二：天然酵种: chapters/02-leavening/12-sourdough.md
      - 第 13 章 · 化学膨发：小苏打、泡打粉与酸碱配平: chapters/02-leavening/13-chemical-leavening.md
      - 第 14 章 · 物理膨发一：打发: chapters/02-leavening/14-whipping.md
      - 第 15 章 · 物理膨发二：蒸汽: chapters/02-leavening/15-steam.md
      - 🛠 项目 P2 · 三条膨发路线的对照: chapters/02-leavening/project-P2-three-leavening-routes.md
  - 第三部分 · 结构是怎么立住的:
      - chapters/03-structure/00-intro.md
      - 第 16 章 · 面筋网络：怎么形成、怎么被破坏: chapters/03-structure/16-gluten-network.md
      - 第 17 章 · 淀粉糊化：烘焙里的糊化不一样: chapters/03-structure/17-gelatinization.md
      - 第 18 章 · 蛋白质凝固与凝胶: chapters/03-structure/18-protein-coagulation.md
      - 第 19 章 · 脂肪结晶与“层”: chapters/03-structure/19-fat-crystals-layers.md
      - 第 20 章 · 面团 vs 面糊的谱系: chapters/03-structure/20-dough-batter-spectrum.md
      - 第 21 章 · 烤箱里的时间轴: chapters/03-structure/21-oven-timeline.md
  - 记录表:
      - forms/index.md
      - 配方解码表: forms/recipe-decode.md
      - 烘焙记录与复盘表: forms/bake-log.md
  - 术语表: glossary.md
  - 参考书目与出处登记: standards.md
  - 思考题参考答案:
      - 第 1 章: qa/01-what-each-ingredient-does-qa.md
      - 第 2 章: qa/02-flour-qa.md
      - 第 3 章: qa/03-water-qa.md
      - 第 4 章: qa/04-sugar-qa.md
      - 第 5 章: qa/05-fat-qa.md
      - 第 6 章: qa/06-egg-qa.md
      - 第 7 章: qa/07-salt-qa.md
      - 第 8 章: qa/08-leavening-agents-qa.md
      - 第 9 章: qa/09-bakers-percentage-qa.md
      - 第 10 章: qa/10-leavening-model-qa.md
      - 第 11 章: qa/11-yeast-qa.md
      - 第 12 章: qa/12-sourdough-qa.md
      - 第 13 章: qa/13-chemical-leavening-qa.md
      - 第 14 章: qa/14-whipping-qa.md
      - 第 15 章: qa/15-steam-qa.md
      - 第 16 章: qa/16-gluten-network-qa.md
      - 第 17 章: qa/17-gelatinization-qa.md
      - 第 18 章: qa/18-protein-coagulation-qa.md
      - 第 19 章: qa/19-fat-crystals-layers-qa.md
      - 第 20 章: qa/20-dough-batter-spectrum-qa.md
      - 第 21 章: qa/21-oven-timeline-qa.md

extra:
  # 点页头站名/logo 回书架。用 !ENV 由 build_site.py 注入，
  # 这样改仓库名仍然只需要动 books.yml 一行。
  homepage: !ENV [SHELF_URL, "/"]

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
