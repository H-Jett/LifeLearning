site_name: 系统学缠论：从走势分类到可检验的判据
site_description: 一本边学边记、力求正确的缠论入门书——讲透定义，并把每条主张标清楚是定义、推论、经验断言还是不可证伪
site_url: !ENV [BOOK_SITE_URL, "http://127.0.0.1:8000/"]   # 由 scripts/build_site.py 按 books.yml 注入
repo_url: https://github.com/H-Jett/LifeLearning
repo_name: H-Jett/LifeLearning
edit_uri: edit/main/books/chanlun/docs/

theme:
  name: material
  custom_dir: overrides        # PWA 注入（manifest / SW / 地址栏配色），由 build_site.py 生成
  favicon: assets/favicon.svg
  language: zh
  palette:
    # 亮色 / 暗色切换
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.instant           # 站内跳转不整页刷新，手机上体感接近 app
    - navigation.instant.prefetch  # 悬停即预取（桌面端受益，触屏无副作用）
    - navigation.instant.progress  # 慢网络下显示顶部进度条
    - header.autohide              # 小屏下滚时收起页头，让出阅读区
    - navigation.indexes    # 允许"章"节点本身是一个页面
    - navigation.footer     # 页脚上一页/下一页翻页
    - navigation.top        # 回到顶部
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit   # 每页「在 GitHub 上编辑」
    - content.code.copy

# 只用 GitHub / 阅读器 / MkDocs 三边通用的可移植 Markdown：
# 不使用 admonition、不使用构建期 include，注释一律用脚注 + 引用块。
markdown_extensions:
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: zh

nav:
  - 首页: index.md
  - 学习路线图: roadmap.md
  - 第一部分 · 入门与地基:
      - chapters/01-foundation/00-intro.md
      - 第 1 章 · 走势只有三类: chapters/01-foundation/01-three-types.md
      - 第 2 章 · 你在看的到底是什么: chapters/01-foundation/02-what-you-see.md
      - 第 3 章 · 级别: chapters/01-foundation/03-levels.md
      - 第 4 章 · 拿到可复现的行情: chapters/01-foundation/04-data.md
      - 第 5 章 · 均线与「吻」：被取代的早期框架: chapters/01-foundation/05-ma-kiss.md
  - 速查与资料:
      - 记号速查: notation.md
      - 出处与资料登记: sources.md
  - 记录表:
      - forms/index.md
      - 走势分解记录表: forms/decomposition-log.md
      - 中枢标注表: forms/pivot-worksheet.md
      - 检验预登记表: forms/prereg-template.md
  - 术语表: glossary.md
  - 思考题参考答案:
      - 第 1 章: qa/01-three-types-qa.md
      - 第 2 章: qa/02-what-you-see-qa.md
      - 第 3 章: qa/03-levels-qa.md
      - 第 4 章: qa/04-data-qa.md
      - 第 5 章: qa/05-ma-kiss-qa.md

extra:
  # 点页头站名/logo 回书架。用 !ENV 由 build_site.py 注入，
  # 这样改仓库名仍然只需要动 books.yml 一行。
  homepage: !ENV [SHELF_URL, "/"]

extra_css:
  - assets/palette.css   # 由 books.yml 下发，勿手改
